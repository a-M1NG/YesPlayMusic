name: Build

# 触发方式：
#   - 合并 PR：PR 合并到 master 后 master 收到提交，自动开始编译
#   - 其它情况只能手动运行：Actions 页面选择本工作流点 Run workflow
# 手动运行时填写 release_tag（例如 v0.4.10）会把三个平台的产物一起发布为草稿 Release，
# 留空则只产出可下载的构建产物（Actions 运行页面底部的 Artifacts）
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 非空时用这个标签发布草稿 Release（例如 v0.4.10）
        required: false
        default: ''

# 发布 Release 需要写权限；只编译时用不到
permissions:
  contents: write

env:
  # 构建期注入的前端环境变量，与仓库外被忽略的 .env 一致
  VUE_APP_NETEASE_API_URL: /api
  VUE_APP_ELECTRON_API_URL: /api
  VUE_APP_ELECTRON_API_URL_DEV: http://127.0.0.1:10754
  VUE_APP_LASTFM_API_KEY: 09c55292403d961aa517ff7f5e8a3d9c
  VUE_APP_LASTFM_API_SHARED_SECRET: 307c9fda32b3904e53654baff215cb67

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            # vue.config.js 的 mac 目标列出 x64、arm64、universal 三种架构，这里不加额外参数
            build: npx vue-cli-service electron:build -p never -m
            artifact: YesPlayMusic-macos
            files: |
              dist_electron/*.dmg
              dist_electron/*.dmg.blockmap
              dist_electron/latest-mac.yml
          - name: windows
            os: windows-latest
            build: npx vue-cli-service electron:build -p never -w
            artifact: YesPlayMusic-windows
            files: |
              dist_electron/*.exe
              dist_electron/*.exe.blockmap
              dist_electron/latest.yml
          - name: linux
            os: ubuntu-22.04
            build: npx vue-cli-service electron:build -p never -l
            artifact: YesPlayMusic-linux
            files: |
              dist_electron/*.AppImage
              dist_electron/*.deb
              dist_electron/*.rpm
              dist_electron/*.snap
              dist_electron/*.pacman
              dist_electron/*.tar.gz
              dist_electron/latest-linux.yml
    steps:
      # 子模块只用于查阅 AMLL 源码，编译过程不需要，因此不检出，省掉一次大仓库克隆
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node.js 与 Yarn
        uses: actions/setup-node@v4
        with:
          # 项目 engines 要求 Node 22.12 以上：@applemusic-like-lyrics/core 把测试工具 vitest 4 列为
          # 运行时依赖，它要求 Node 20 以上，Node 16 完成不了安装
          node-version: 22
          cache: 'yarn'

      - name: 安装 Linux 打包工具
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm libarchive-tools libopenjp2-tools

      - name: 安装 Snapcraft
        if: runner.os == 'Linux'
        uses: samuelmeuli/action-snapcraft@v3

      - name: 安装依赖
        run: yarn install --ignore-optional

      - name: 读取原生模块版本
        id: unm
        shell: bash
        run: |
          echo "version=$(node -p "require('./node_modules/@unblockneteasemusic/rust-napi/package.json').version")" >> "$GITHUB_OUTPUT"

      # rust-napi 的平台二进制是可选依赖，按当前平台补装，否则打包出来的应用缺少解码模块
      - name: 补装 macOS 原生模块
        if: runner.os == 'macOS'
        shell: bash
        run: |
          yarn add --ignore-platform --ignore-optional \
            @unblockneteasemusic/rust-napi-darwin-x64@${{ steps.unm.outputs.version }} \
            @unblockneteasemusic/rust-napi-darwin-arm64@${{ steps.unm.outputs.version }} \
            dmg-license

      - name: 补装 Windows 原生模块
        if: runner.os == 'Windows'
        shell: bash
        run: |
          yarn add --ignore-platform --ignore-optional \
            @unblockneteasemusic/rust-napi-win32-x64-msvc@${{ steps.unm.outputs.version }}

      - name: 补装 Linux 原生模块
        if: runner.os == 'Linux'
        shell: bash
        run: |
          yarn add --ignore-platform --ignore-optional \
            @unblockneteasemusic/rust-napi-linux-x64-gnu@${{ steps.unm.outputs.version }} \
            @unblockneteasemusic/rust-napi-linux-arm64-gnu@${{ steps.unm.outputs.version }} \
            @unblockneteasemusic/rust-napi-linux-arm-gnueabihf@${{ steps.unm.outputs.version }}

      # webpack 4 的压缩环节在 Node 17 以上要用 OpenSSL 的旧算法，否则打包时报
      # error:0308010C:digital envelope routines::unsupported
      - name: 编译 ${{ matrix.name }}
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: ${{ matrix.build }}

      - name: 上传 ${{ matrix.name }} 产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0

  release:
    name: 发布草稿 Release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: 收集全部产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: 创建草稿 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_tag }}
          draft: true
          generate_release_notes: true
          files: release-assets/**/*
